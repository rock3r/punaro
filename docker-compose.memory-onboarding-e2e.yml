services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    environment:
      POSTGRES_DB: punaro
      POSTGRES_USER: punaro_owner
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-test-init.sql:/docker-entrypoint-initdb.d/10-punaro-test.sql:ro
    networks: [memory-onboarding]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punaro_owner -d punaro"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  memory-onboarding-e2e:
    build:
      context: .
      target: build
    command: ["go", "test", "-p", "1", "-count=1", "-timeout", "3m", "-tags=memory_onboarding_e2e", "./cmd/punaro-memory", "-run", "^Test(MemoryOnboarding.*|InstalledMemoryClientOnboardingE2E)$"]
    user: "65532:65532"
    environment:
      HOME: /home/punaro
      TMPDIR: /home/punaro/tmp
      GOCACHE: /tmp/punaro-go-build
      PUNARO_E2E_POSTGRES_OWNER_DSN: postgres://punaro_owner@postgres:5432/punaro?sslmode=disable
      PUNARO_E2E_POSTGRES_APP_DSN: postgres://punaro_app@postgres:5432/punaro?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memory-onboarding]

networks:
  memory-onboarding:
    internal: true

volumes:
  postgres-data:
