# App credentials may authenticate only to the Punaro database. This rule must
# precede the generic owner/bootstrap rule because PostgreSQL uses first match.
host    punaro  punaro_app    127.0.0.1/32    scram-sha-256
host    all     punaro_app    127.0.0.1/32    reject
host    all     all           127.0.0.1/32    scram-sha-256
