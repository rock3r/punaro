# Reference single-node production bundle. Start `postgres-bootstrap`, then
# run `punaro init` to publish the host-local lifecycle and migrate a pristine
# schema; ordinary Compose startup never migrates an existing schema. Both the
# daemon image and pgvector digest are release inputs.
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    environment:
      POSTGRES_DB: punaro
      POSTGRES_USER: punaro_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_owner_password
      - postgres_app_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-entrypoint.sh:/usr/local/bin/punaro-postgres-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/punaro-postgres-entrypoint.sh"]
    tmpfs:
      - /run/punaro-secrets:mode=0700,size=1m
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 -U punaro_owner -d punaro"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres-bootstrap:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    entrypoint: ["/usr/local/bin/punaro-postgres-bootstrap.sh"]
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=0700,noexec,nosuid,nodev,size=16m
    environment:
      POSTGRES_DB: punaro
      POSTGRES_USER: punaro_owner
    secrets:
      - postgres_app_password
      - postgres_owner_password
    volumes:
      - ./postgres-bootstrap.sh:/usr/local/bin/punaro-postgres-bootstrap.sh:ro
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  punarod:
    profiles: ["reference-daemon"]
    image: ${PUNARO_IMAGE:?required}
    init: true
    user: "${PUNARO_RUNTIME_UID:?required}:${PUNARO_RUNTIME_GID:?required}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    environment:
      PUNARO_DATA_DIR: /var/lib/punaro
      PUNARO_LISTEN_ADDR: 127.0.0.1:8080
      PUNARO_HEALTH_LISTEN_ADDR: 127.0.0.1:8081
      PUNARO_POSTGRES_ENABLED: "true"
      PUNARO_POSTGRES_DSN_FILE: /run/secrets/postgres_app_dsn
      PUNARO_DEVICE_AUTH_ENABLED: "true"
      PUNARO_MEMORY_API_ENABLED: "false"
      PUNARO_RELAY_ENABLED: "false"
      PUNARO_RELAY_STORE: sqlite
      PUNARO_INGRESS_MODE: proxy
      PUNARO_PUBLIC_URL: ${PUNARO_PUBLIC_URL:?required}
      PUNARO_TRUSTED_LAN_HTTP: "false"
    secrets:
      - postgres_app_dsn
    volumes:
      - punaro-blobs:/var/lib/punaro
    network_mode: host
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  postgres_owner_password:
    file: ${PUNARO_POSTGRES_OWNER_PASSWORD_FILE:?required}
  postgres_app_dsn:
    file: ${PUNARO_POSTGRES_APP_DSN_FILE:?required}
  postgres_app_password:
    file: ${PUNARO_POSTGRES_APP_PASSWORD_FILE:?required}

volumes:
  postgres-data:
  punaro-blobs:
